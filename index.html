<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <title>Happy Birthday, Pratap!</title>
  <meta name="description" content="An interactive birthday celebration, built for the team." />

  <!-- Google Fonts: Space Grotesk (display/kinetic type) + Inter (body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================
       CUSTOM CURSOR
       Only activated by script.js on fine-pointer, non-touch,
       motion-friendly devices. Stays inert (and invisible, see
       style.css) everywhere else, so there is no broken/missing
       cursor fallback state.
       ============================================================ -->
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <!-- ============================================================
       HERO
       ============================================================ -->
  <section class="hero" id="hero">
    <div class="ambient-glow-layer">
      <div class="ambient-glow ambient-glow--gold" aria-hidden="true"></div>
    </div>
    <div class="ambient-glow-layer">
      <div class="ambient-glow ambient-glow--ember" aria-hidden="true"></div>
    </div>

    <canvas id="hero-canvas" aria-hidden="true"></canvas>

    <div class="hero-content">
      <p class="eyebrow">A little something from the team</p>

      <button class="unwrap-cta" id="unwrap-cta" type="button" data-cursor="link">
        <span class="unwrap-cta__dot" aria-hidden="true"></span>
        Click to unwrap
      </button>

      <h1 class="kinetic-heading" id="birthday-heading">
        <span class="kinetic-heading__line">Happy Birthday,</span>
        <span class="kinetic-heading__line kinetic-heading__line--accent" id="birthday-name">Pratap!</span>
      </h1>

      <div class="scroll-cue" id="scroll-cue" aria-hidden="true">
        <span>Scroll</span>
        <span class="scroll-cue__line"></span>
      </div>
    </div>
  </section>

  <!-- ============================================================
       TEAM MESSAGES
       Cards are generated by script.js from CONFIG.messages —
       edit the array at the top of that file, not this markup.
       ============================================================ -->
  <section class="wishes" id="wishes">
    <div class="wishes__header">
      <p class="eyebrow">From the team</p>
      <h2 class="wishes__heading">A few things they wanted you to know</h2>
    </div>

    <div class="wishes__grid" id="wishes-grid"></div>
  </section>

  <footer class="site-footer">
    <p>Made with care, for someone who deserves it.</p>
  </footer>

  <!-- Fallback for JS-disabled visits: this experience is built to be interactive,
       so this is a plain-text safety net rather than a full alternate layout. -->
  <noscript>
    <div style="max-width:560px;margin:4rem auto;padding:0 1.5rem;font-family:sans-serif;color:#f4f1ec;text-align:center;">
      <h1>Happy Birthday, Pratap!</h1>
      <p>This page uses JavaScript for its interactive 3D celebration — enable it to see the full experience.</p>
    </div>
  </noscript>

  <!-- ============================================================
       SCRIPTS
       Order matters: the classic (non-module) libraries below must
       run before script.js, since script.js references their
       globals (gsap, ScrollTrigger, SplitText, VanillaTilt).
       Placed at the end of body so the CSS-only hero background
       paints immediately instead of waiting on JS to download.
       ============================================================ -->

  <!-- GSAP core + plugins. As of GSAP 3.13, SplitText and every other
       former "Club GreenSock" plugin is free — no license key needed. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>

  <!-- Vanilla-Tilt: 3D hover tilt + built-in glare for the message cards -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

  <!-- Three.js is ES-module-only since r161 (the old global three.min.js
       build was removed upstream) — an import map is the correct modern
       way to load it from a CDN via a plain <script type="module">.
       IMPORTANT: because script.js is a module, opening this file directly
       via file:// will be blocked by the browser's CORS rules for modules.
       Serve the folder locally instead, e.g.:
         python3 -m http.server 8000     then open http://localhost:8000
       or use any "Live Server"-style tool / static host. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js"
    }
  }
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
